<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="CredWise AI — Credit-risk scoring platform. An XGBoost model trained on 150K borrowers scores applicants and explains every score with SHAP reasons.">
<title>CredWise AI — Credit-risk scoring platform. An XGBoost model trained on 150K borrowers scores applicants and explains every score with SHAP reasons.</title>
<style>.s{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.1s steps(1) infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.flow{stroke-dasharray:3 9;animation:flow 1.8s linear infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.25}}@keyframes flow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow{animation:none}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505" stop-opacity="1"/><stop offset="0.55" stop-color="#080B12" stop-opacity="1"/><stop offset="1" stop-color="#0B1020" stop-opacity="1"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F7CFF" stop-opacity="0"/><stop offset="0.3" stop-color="#4F7CFF" stop-opacity="1"/><stop offset="0.7" stop-color="#8B5CF6" stop-opacity="1"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect width="480" height="300" rx="16"/></clipPath><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/></pattern><radialGradient id="gfade"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient><mask id="gmask"><rect width="480" height="300" fill="url(#gfade)"/></mask><radialGradient id="glow0"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.3"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="glow1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.1"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><linearGradient id="name" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F6FC" stop-opacity="1"/><stop offset="1" stop-color="#C9D3EA" stop-opacity="1"/></linearGradient></defs>
