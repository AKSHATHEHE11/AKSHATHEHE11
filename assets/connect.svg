<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Building something interesting? Let's talk.">
<title>Building something interesting? Let's talk.</title>
<style>.s{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.1s steps(1) infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.flow{stroke-dasharray:3 9;animation:flow 1.8s linear infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.25}}@keyframes flow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow{animation:none}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505" stop-opacity="1"/><stop offset="0.55" stop-color="#080B12" stop-opacity="1"/><stop offset="1" stop-color="#0B1020" stop-opacity="1"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F7CFF" stop-opacity="0"/><stop offset="0.3" stop-color="#4F7CFF" stop-opacity="1"/><stop offset="0.7" stop-color="#8B5CF6" stop-opacity="1"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect width="1000" height="230" rx="18"/></clipPath><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/></pattern><radialGradient id="gfade"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient><mask id="gmask"><rect width="1000" height="230" fill="url(#gfade)"/></mask><radialGradient id="glow0"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="glow1"><stop offset="0" stop-color="#4F7CFF" stop-opacity="0.22"/><stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/></radialGradient><linearGradient id="acc" x1="300" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#60A5FA" stop-opacity="1"/><stop offset="0.55" stop-color="#A78BFA" stop-opacity="1"/><stop offset="1" stop-color="#22D3EE" stop-opacity="1"/></linearGradient></defs>
<g clip-path="url(#clip)">
<rect width="1000" height="230" fill="url(#bg)"/>
<rect width="1000" height="230" fill="url(#grid)" mask="url(#gmask)"/>
<ellipse cx="500" cy="0" rx="520" ry="200" fill="url(#glow0)"/>
<ellipse cx="500" cy="230" rx="520" ry="160" fill="url(#glow1)"/>
<rect x="18" y="0" width="964" height="1" fill="url(#edge)" opacity=".7"/>
</g>
<rect x=".5" y=".5" width="999" height="229" rx="18" fill="none" stroke="#1C2540"/>
<text x="500" y="98" class="s" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="-.5"><tspan fill="#F3F6FC">Building something </tspan><tspan fill="url(#acc)">interesting?</tspan></text>
<text x="500" y="136" class="s" font-size="17" font-weight="400" fill="#8D97AD" text-anchor="middle">Let's talk about full-stack products, cloud and applied AI.</text>
<rect x="40" y="172" width="920" height="1" fill="#FFFFFF" opacity="0.06"/>
<text x="500" y="202" class="m" font-size="11" font-weight="400" fill="#5B647A" text-anchor="middle" letter-spacing="1">AKSHAT AGRAWAL  ·  FULL-STACK DEVELOPER  ·  B.TECH CSE 2027</text>
</svg>
