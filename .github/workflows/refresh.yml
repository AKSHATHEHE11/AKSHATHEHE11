name: Refresh profile visuals

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          # Commit as the profile owner so the repo's only author/contributor is AKSHATHEHE11.
          git config user.name "AKSHATHEHE11"
          git config user.email "206327237+AKSHATHEHE11@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Refresh profile visuals" && git push; }
